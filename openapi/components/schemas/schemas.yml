lakesPoly:
  properties:
    data:
      items:
        properties:
          avgdepth:
            description: |
              Average lake depth, in meters.
              Average lake depth is defined as the ratio between total lake volume (`volume`) and lake area (`lakearea`).
            type: number
          hydrolakeid:
            description: |
              Unique lake identifier in the [HydroLakes10k](https://www.hydrosheds.org/products/hydrolakes) database.
            type: integer
          lakearea:
            description: Lake area in square kilometers.
            type: integer
          lakename:
            description: |
              Name of lake or reservoir.<br> This field is currently only populated for lakes with an area of at least 500km^2^; for large reservoirs where a name was available in the GRanD database; and for smaller lakes where a name was available in the GLWD database. [source PDF](https://data.hydrosheds.org/file/technical-documentation/HydroLAKES_TechDoc_v10.pdf)
            type: string
          shorelen:
            description: Shore length/lake perimeter in kilometers.
            type: integer
          volume:
            description: >
              Total lake or reservoir volume, in million cubic meters (1*mcm* = 0.001 km^3^).<br> For most polygons, this value represents the total lake volume as estimated using the geostatistical modeling approach by Messager et al. (2016). However, where either a reported lake volume (for lakes ≥ 500 km^2^) or a reported reservoir volume (from GRanD database) existed, the total volume represents this reported value. In cases of regulated lakes, the total volume represents the larger value
              between reported reservoir and modeled or reported lake volume. [source PDF](https://data.hydrosheds.org/file/technical-documentation/HydroLAKES_TechDoc_v10.pdf)
            type: number
          watershedarea:
            description: |
              Area of the watershed associated with the lake, in square kilometers.<br>
              The watershed area is calculated by deriving and measuring the upstream contribution area to the lake pour point using the HydroSHEDS drainage network map at 15 arc-second resolution.
              Value is **-9999** when there is no data as lake pour point is not on HydroSHEDS landmask.
            type: number
          wkt_shape:
            description: |
              A Well-Known-Text representation of the lake, resolved to the appropriate precision.
            type: string
      type: array
    message:
      type: string
    status:
      type: string
