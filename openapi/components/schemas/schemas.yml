address:
  description: A physical address, as a single string.
  example: 550 N Park St, Madison WI, USA
  nullable: true
  type: string
ageold:
  description: For records where the ages are obtained from a model, or have an assigned range, `ageold` represents the older bound of the age range.
  example: 1000
  nullable: true
  type: number
agerange:
  description: |
    The set of ages describing a sample age measured with uncertainty. Often described as the accepted age of the sample and then a younger and older age defined by ±1SD. The age range may be further defined in chronology or dataset notes.
  properties:
    ageold:
      $ref: '#/components/schemas/ageold'
    agetype:
      $ref: '#/components/schemas/agetype'
    ageyoung:
      $ref: '#/components/schemas/ageyoung'
  type: object
agetype:
  enum:
    - Calendar years AD/BC
    - Calendar years BP
    - Calibrated radiocarbon years BP
    - Radiocarbon years BP
    - Varve years BP
  type: string
ageyoung:
  description: For records where the ages are obtained from a model, or have an assigned range, `ageyoung` represents the younger bound of the age range (the more recent age).
  example: -35
  nullable: true
  type: number
aliasid:
  example: 123
  format: int64
  type: integer
altitude:
  example: 0
  format: int32
  maximum: 9000
  minimum: -500
  type: integer
authorpiresponse:
  properties:
    data:
      items:
        properties:
          getpeople:
            type: string
        type: object
      type: array
    message:
