            ageyounger:
              $ref: '#/components/schemas/ageyoung'
          type: object
        controltype:
          example: Core top
          type: string
        depth:
          example: 0.5
          type: number
        thickness:
          example: 2
          type: number
      type: object
    dataset:
      properties:
        datasetid:
          $ref: '#/components/schemas/datasetid'
        datasettype:
          $ref: '#/components/schemas/datasettype'
      type: object
    datePrepared:
      $ref: '#/components/schemas/date'
