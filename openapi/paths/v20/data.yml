/v2.0/data/spatial/faunal:
  get:
    parameters:
      - $ref: '#/components/parameters/scinameQuery'
      - $ref: '#/components/parameters/projQuery'
      - $ref: '#/components/parameters/precQuery'
    responses:
      '200':
        description: |
          An object containing all matched species names, identifiers and a GeoJSON polygon representing the UNIONed ranges for the selected species. All data is derived from:<br>
          * Mammal Diversity Database. (2020). Mammal Diversity Database (Version 1.2) [Data set]. Zenodo. DOI: [10.5281/zenodo.4139818](https://doi.org/10.5281/zenodo.4139818).<br>
          * Map of Life. (2021). Mammal range maps harmonised to the Mammals Diversity Database [Data set]. Map of Life. [10.48600/MOL-48VZ-P413](https://doi.org/10.48600/MOL-48VZ-P413)
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/faunalPoly'
    tags:
      - External data
      - v2.0
      - Mammals
      - Spatial
/v2.0/data/spatial/icesheet:
  get:
    parameters:
      - $ref: '#/components/parameters/ageQuery'
      - $ref: '#/components/parameters/projQuery'
      - $ref: '#/components/parameters/precQuery'
    responses:
      '200':
        description: |
          An object containing glacial extents for the selected time period (in **calibrated radiocarbon years**).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/icesheetPoly'
    tags:
      - External data
      - v2.0
      - Glaciares
      - Spatial
/v2.0/data/spatial/lakes:
  get:
    parameters:
      - $ref: '#/components/parameters/siteidQuery'
      - $ref: '#/components/parameters/bufferQuery'
      - $ref: '#/components/parameters/precQuery'
      - $ref: '#/components/parameters/projQuery'
    responses:
      '200':
        description: |
          An object containing all matched lakes within some buffer distance of a site. Data derived from the [HydroLakes database](https://www.hydrosheds.org/products/hydrolakes):<br>
          * Messager, M.L., Lehner, B., Grill, G., Nedeva, I., Schmitt, O. (2016). Estimating the volume and age of water stored in global lakes using a geo-statistical approach. *Nature Communications*, 7: 13603. doi: [10.1038/ncomms13603](https://doi.org/10.1038/ncomms13603)
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/lakesPoly'
    tags:
      - External data
      - v2.0
      - Lake morphometry
      - Spatial
