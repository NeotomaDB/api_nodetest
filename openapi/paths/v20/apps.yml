/v2.0/apps/taphonomysystems:
  get:
    parameters:
      - description: Unique dataset type identifier. Note that not all dataset types have associated taphonomy systems, 
          so a valid datasettype may result in an empty response. Users who require more information may use the `dbtables`
          endpoints to access the [`taphonomicsystemsdatasettypes` table](https://open.neotomadb.org/dbschema/ndb/tables/taphonomicsystemsdatasettypes.html). This table will list all taphonomic systems
          associated with each dataset type.
        in: query
        name: datasettypeid
        required: true
        schema:
          format: int64
          maximum: 44
          minimum: 1
          type: integer
    responses:
      '200':
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/taphonomyresponse'
        description: A table of Neotoma collection types.
    tags:
      - Dataset metadata
      - v2.0
