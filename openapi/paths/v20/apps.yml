/v2.0/apps/depenvt:
  get:
    parameters:
      - $ref: '#/components/parameters/siteidQuery'
      - $ref: '#/components/parameters/datasetidQuery'
      - $ref: '#/components/parameters/collectionunitidQuery'
    responses:
      '200':
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/depenvbyid' 
        description: 'This returns the information about depositional
          environment for selected dataset/collention unit/site.'
    tags:
      - v2.0
      - depositional environment 
/v2.0/apps/constdb:
  get:
    responses:
      '200':
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/constdbresponse'
        description: 'Returns metadata about each [constituent
          database](https://www.neotomadb.org/data/constituent-databases) in
          Neotoma, including Summary Information about dataset types within
          the database and the age spans of the records in the database.
          Constituent databases '
    tags:
      - Database metadata
      - Summary Informationrmation
      - v2.0
/v2.0/apps/constdb/datasetages:
  get:
    parameters:
      - $ref: '#/components/parameters/dbidQuery'
    responses:
      '200':
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/datasetagerangeresponse'
        description: |
          Returns an ordered array (from earliest to latest) of upload counts by month (YYYY/MM/DD; all days as 01). Months with no uploads are excluded.
    tags:
      - Dataset metadata
      - Summary Information
      - v2.0
/v2.0/apps/constdb/datasetuploads:
  get:
    parameters:
      - $ref: '#/components/parameters/dbidQuery'
    responses:
      '200':
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/datasetuploadresponse'
        description: |
          Returns an ordered array (from earliest to latest) of upload counts by month (YYYY/MM/DD; all days as 01). Months with no uploads are excluded.
    tags:
      - Dataset metadata
      - Summary Information
      - v2.0
/v2.0/apps/constdb/datasets:
  get:
    parameters:
      - $ref: '#/components/parameters/dbidQuery'
    responses:
      '200':
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/datasetsShort'
        description: |
          Returns the set of datasets contained within a constituent database, identified by the constituent database identifier. Used for quick landing page generation.
    tags:
      - Dataset metadata
      - v2.0
