version: "3.8"
services:
  api:
    build:
      context: https://github.com/NeotomaDB/api_nodetest.git#feature/dockercompose
      dockerfile: Dockerfile
    container_name: node-express-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - RDS_HOSTNAME=db-proxy
      - RDS_PORT=5432
      - RDS_DATABASE=${RDS_DATABASE}
      - RDS_USERNAME=${RDS_USERNAME}
      - RDS_PASSWORD=${RDS_PASSWORD}
      - DB_SSL=true
      - PORT=3001
      - API_URL=http://localhost:3001
    depends_on:
      - db-proxy
    networks:
      - app-network
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
  db-proxy:
    image: alpine/socat:latest
    container_name: db-proxy
    restart: unless-stopped
    command: >
      tcp-listen:5432,fork,reuseaddr
      tcp-connect:host.docker.internal:${RDS_PORT}
    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

# Custom network configuration
networks:
  app-network:
    driver: bridge

# Named volumes for data persistence
volumes:
  app-logs:
    driver: local
